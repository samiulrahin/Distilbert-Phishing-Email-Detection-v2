[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-distilbert-gmail-extension"
version = "0.1.0"
description = "Privacy-aware DistilBERT phishing email feasibility prototype"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]
addopts = "-q"

